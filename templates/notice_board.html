<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Notice Board</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f4f6f9;
    margin:0;
    padding:30px;
}

.container{
    max-width:800px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
}

h1{
    color:#2563eb;
    text-align:center;
}

.notice{
    background:#fff8dc;
    border-left:6px solid orange;
    padding:20px;
    margin-top:20px;
    border-radius:8px;
}

.notice h3{
    color:#d35400;
}

.back{
    display:inline-block;
    margin-top:20px;
    padding:10px 20px;
    background:#2563eb;
    color:white;
    text-decoration:none;
    border-radius:5px;
}
</style>

</head>
<body>

<div class="container">

<h1>📢 Hostel Notice Board</h1>

{% if notices %}

    {% for notice in notices %}

    <div class="notice">

        <h3>{{ notice.title }}</h3>

        <p><b>Date:</b> {{ notice.notice_date }}</p>

        <p>{{ notice.message }}</p>

    </div>

    {% endfor %}

{% else %}

<h3>No Notices Available</h3>

{% endif %}

<a href="/student_dashboard" class="back">
⬅ Back to Dashboard
</a>

</div>

</body>
</html>
