<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raise Complaint</title>

    <style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:linear-gradient(135deg,#667eea,#764ba2);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;
}

.container{
    width:650px;
    background:white;
    padding:35px;
    border-radius:20px;
    box-shadow:0 15px 35px rgba(0,0,0,.25);
}

h1{
    text-align:center;
    color:#1e3a8a;
    margin-bottom:25px;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:8px;
    color:#374151;
}

input,
select,
textarea{
    width:100%;
    padding:13px;
    border:1px solid #d1d5db;
    border-radius:10px;
    margin-bottom:20px;
    font-size:15px;
}

input:focus,
select:focus,
textarea:focus{
    outline:none;
    border-color:#2563eb;
    box-shadow:0 0 8px rgba(37,99,235,.25);
}

textarea{
    min-height:130px;
    resize:vertical;
}

.submit-btn{
    width:100%;
    padding:15px;
    background:linear-gradient(135deg,#10b981,#059669);
    color:white;
    border:none;
    border-radius:10px;
    font-size:17px;
    cursor:pointer;
    transition:.3s;
}

.submit-btn:hover{
    transform:translateY(-2px);
    background:linear-gradient(135deg,#059669,#047857);
}

.back-btn{
    width:100%;
    margin-top:15px;
    padding:15px;
    background:linear-gradient(135deg,#2563eb,#1d4ed8);
    color:white;
    border:none;
    border-radius:10px;
    font-size:17px;
    cursor:pointer;
    transition:.3s;
}

.back-btn:hover{
    transform:translateY(-2px);
    background:linear-gradient(135deg,#1d4ed8,#1e40af);
}

</style>

</head>

<body>

<div class="container">
    

<h1>📝 Raise Complaint</h1>

<form action="/submit_complaint" method="POST">


<label>🏠 Room Number</label>
<input type="text" name="room" placeholder="Enter Room Number" required>

<label>📂 Complaint Category</label>

<select name="category" required>
    <option value="">Select Category</option>
    <option>⚡ Electrical</option>
    <option>🚰 Plumbing</option>
    <option>🧹 Cleaning</option>
    <option>🌐 Internet</option>
    <option>🍽 Mess</option>
    <option>🛏 Furniture</option>
    <option>🚪 Door/Window</option>
    <option>❄ Fan/AC</option>
    <option>💡 Lights</option>
    <option>📌 Other</option>
</select>


<label>📝 Complaint Description</label>

<textarea
name="description"
placeholder="Describe your complaint in detail..."
required></textarea>

<button type="submit" class="submit-btn">
✅ Submit Complaint
</button>

</form>

<a href="/student_dashboard">
<button class="back-btn">
⬅ Back to Dashboard
</button>
</a>

</div>

</body>
</html>
