<!DOCTYPE html>
<html>
<head>

<title>Edit Profile</title>

<style>

body{
    background:#f4f6f9;
    font-family:Arial;
}

.container{
    width:500px;
    margin:40px auto;
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 5px 15px rgba(0,0,0,.2);
}

h2{
    text-align:center;
    color:#2563eb;
}

input{
    width:100%;
    padding:12px;
    margin:12px 0;
    border:1px solid #ccc;
    border-radius:8px;
}

button{
    width:100%;
    padding:15px;
    background:#16a34a;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:17px;
}

button:hover{
    background:#15803d;
}

a{
    display:block;
    margin-top:20px;
    text-align:center;
    text-decoration:none;
}

</style>

</head>

<body>

<div class="container">

<h2>✏ Edit Profile</h2>

<form action="/update_profile" method="POST">

<label>Full Name</label>

<input
type="text"
name="fullname"
value="{{ student.fullname }}"
required>

<label>Email</label>

<input
type="email"
name="email"
value="{{ student.email }}"
required>

<label>Phone</label>

<input
type="text"
name="phone"
value="{{ student.phone }}"
required>

<label>Room</label>

<input
type="text"
name="room"
value="{{ student.room }}"
required>

<button type="submit">
Update Profile
</button>

</form>

<a href="/profile">
⬅ Back
</a>

</div>

</body>
</html>
