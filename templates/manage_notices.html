<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Notices</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f6f9;
}

.container{
    width:90%;
    margin:40px auto;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.header h2{
    color:#2563eb;
}

.add-btn{
    background:#16a34a;
    color:white;
    padding:12px 20px;
    text-decoration:none;
    border-radius:8px;
    font-weight:bold;
}

.add-btn:hover{
    background:#15803d;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
    border-radius:10px;
    overflow:hidden;
}

th{
    background:#2563eb;
    color:white;
    padding:15px;
}

td{
    padding:15px;
    border-bottom:1px solid #ddd;
    text-align:center;
}

tr:nth-child(even){
    background:#f8fafc;
}

.delete-btn{
    background:#dc2626;
    color:white;
    padding:8px 15px;
    text-decoration:none;
    border-radius:6px;
}

.delete-btn:hover{
    background:#b91c1c;
}

.back-btn{
    display:inline-block;
    margin-top:20px;
    background:#2563eb;
    color:white;
    padding:10px 18px;
    text-decoration:none;
    border-radius:8px;
}

</style>

</head>

<body>

<div class="container">

<div class="header">

<h2>📢 Manage Notices</h2>

<a href="{{ url_for('add_notice') }}">
    + Add New Notice
</a>

</div>

<table>

<tr>
<th>ID</th>
<th>Title</th>
<th>Message</th>
<th>Date</th>
<th>Action</th>
</tr>

{% for notice in notices %}

<tr>

<td>{{ notice.id }}</td>

<td>{{ notice.title }}</td>

<td>{{ notice.message }}</td>

<td>{{ notice.notice_date }}</td>

<td>

<a href="/delete_notice/{{ notice.id }}"
class="delete-btn"
onclick="return confirm('Delete this notice?')">
Delete
</a>

</td>

</tr>

{% endfor %}

</table>

<a href="/admin_dashboard" class="back-btn">
⬅ Back to Dashboard
</a>

</div>

</body>
</html>
