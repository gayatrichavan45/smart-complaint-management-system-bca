<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Login</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}


body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#11998e,#38ef7d);
}


.login-box{
width:400px;
background:#fff;
padding:35px;
border-radius:20px;
box-shadow:0 0 25px rgba(0,0,0,.3);
text-align:center;
}


h1{
color:#198754;
margin-bottom:10px;
}


p{
margin-bottom:25px;
color:gray;
}


label{
font-size:18px;
}


input{
width:100%;
padding:14px;
margin:10px 0;
border-radius:10px;
border:1px solid #ccc;
font-size:16px;
}


button{
width:100%;
padding:14px;
margin-top:15px;
border:none;
border-radius:10px;
background:#198754;
color:white;
font-size:18px;
font-weight:bold;
cursor:pointer;
transition:.3s;
}


button:hover{
background:#146c43;
transform:scale(1.03);
}


/* All Links */

a{
text-decoration:none;
color:#0d6efd;
font-weight:bold;
}


/* Forgot Password */

.forgot{
display:block;
margin-top:15px;
color:#0066ff;
font-size:17px;
}


.forgot:hover{
text-decoration:underline;
}


/* Back Button */

.back{
margin-top:20px;
}


</style>

</head>


<body>


<div class="login-box">


<h1>🎓 Student Login</h1>


<p>Login to Raise Complaint</p>


<form action="/student_login" method="POST">


<label>Email</label><br>

<input type="email" name="email" required>


<br><br>


<label>Password</label><br>

<input type="password" name="password" required>


<br>
<button type="submit">
    Login
</button>

</form>


<a href="{{ url_for('forgot_password') }}" class="forgot">
    Forgot Password?
</a>


<br>


<a href="/student_registration">
    Student Registration
</a>


<div class="back">

<a href="/">
    ⬅ Back to Home
</a>

</div>

</div>

</body>
</html>
