<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#4e54c8,#8f94fb);
}

.login-box{
width:420px;
background:white;
padding:35px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,.4);
text-align:center;
}

h1{
color:#2948ff;
margin-bottom:10px;
}

p{
color:rgb(128, 128, 128);
margin-bottom:25px;
}

input{
width:100%;
padding:14px;
margin:10px 0;
border:2px solid #ddd;
border-radius:10px;
font-size:16px;
}

input:focus{
border-color:#2948ff;
outline:none;
}

button{
width:100%;
padding:14px;
margin-top:15px;
border:none;
border-radius:10px;
background:#2948ff;
color:white;
font-size:18px;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:#1b35d1;
transform:scale(1.03);
}

.back{
margin-top:20px;
}

.back a{
text-decoration:none;
color:#2948ff;
font-weight:bold;
}

</style>

</head>

<body>

<div class="login-box">

<h1>👨‍💼 Admin Login</h1>

<p>Administrator Access Portal</p>

<form action="/admin_login" method="POST">

    <input type="text" name="username" placeholder="Enter Username" required>

    <input type="password" name="password" placeholder="Enter Password" required>

    
    <button type="submit">Login</button>

</form>

<div class="back">
<a href="/">⬅ Back to Home</a>
</div>

</div>

</body>
</html>
